<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="1200" viewBox="0 0 1200 1200" role="img" aria-labelledby="title desc">
  <title id="title">Observatory landmark detail concept</title>
  <desc id="desc">A flat detail concept for the abstract observatory landmark, with tower, light pillar, platform, and orbital rings.</desc>
  <defs>
    <radialGradient id="deep" cx="50%" cy="42%" r="70%">
      <stop offset="0" stop-color="#102f45"/>
      <stop offset=".48" stop-color="#061426"/>
      <stop offset="1" stop-color="#02040b"/>
    </radialGradient>
    <linearGradient id="tower" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0" stop-color="#f4fdff" stop-opacity=".92"/>
      <stop offset=".42" stop-color="#82dfff" stop-opacity=".36"/>
      <stop offset="1" stop-color="#82dfff" stop-opacity=".08"/>
    </linearGradient>
    <linearGradient id="platform" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#82dfff" stop-opacity="0"/>
      <stop offset=".52" stop-color="#b9f1ff" stop-opacity=".5"/>
      <stop offset="1" stop-color="#82dfff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="14" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect width="1200" height="1200" fill="url(#deep)"/>
  <circle cx="600" cy="520" r="342" fill="#82dfff" opacity=".045"/>
  <circle cx="600" cy="520" r="252" fill="#b9f1ff" opacity=".035"/>

  <g opacity=".42">
    <circle cx="146" cy="178" r="1.6" fill="#eefbff"/>
    <circle cx="246" cy="294" r="1.2" fill="#82dfff"/>
    <circle cx="998" cy="236" r="1.6" fill="#d8b86a"/>
    <circle cx="940" cy="910" r="1.3" fill="#eefbff"/>
    <circle cx="224" cy="928" r="1.1" fill="#82dfff"/>
  </g>

  <g transform="translate(600 584)" filter="url(#glow)">
    <ellipse rx="392" ry="104" fill="none" stroke="#82dfff" stroke-width="2" opacity=".28" transform="rotate(-12)"/>
    <ellipse rx="300" ry="82" fill="none" stroke="#d8b86a" stroke-width="2" opacity=".26" transform="rotate(18)"/>
    <ellipse rx="212" ry="56" fill="none" stroke="#b9f1ff" stroke-width="3" opacity=".38"/>
  </g>

  <g transform="translate(600 594)">
    <path d="M-40 236 L40 236 L28 48 L14 48 L8 -152 L-8 -152 L-14 48 L-28 48 Z" fill="url(#tower)"/>
    <path d="M-7 -384 L7 -384 L4 240 L-4 240 Z" fill="#f4fdff" opacity=".52" filter="url(#glow)"/>
    <path d="M-62 56 L62 56 L44 92 L-44 92 Z" fill="#d8b86a" opacity=".16"/>
    <path d="M-122 238 L122 238 L176 292 L-176 292 Z" fill="#82dfff" opacity=".14"/>
    <path d="M-288 292 C-188 262 188 262 288 292 C188 326 -188 326 -288 292 Z" fill="url(#platform)" opacity=".78"/>
    <path d="M-286 292 C-174 324 174 324 286 292" fill="none" stroke="#b9f1ff" stroke-width="2" opacity=".38"/>
    <path d="M-176 292 L-96 366 M176 292 L96 366 M-62 292 L-28 380 M62 292 L28 380" stroke="#82dfff" stroke-width="2" opacity=".18"/>
    <circle cx="0" cy="-154" r="11" fill="#d8b86a" opacity=".9" filter="url(#glow)"/>
    <circle cx="0" cy="52" r="9" fill="#b9f1ff" opacity=".78" filter="url(#glow)"/>
  </g>

  <g transform="translate(94 80)">
    <text x="0" y="0" fill="#b9f1ff" font-family="Inter, Microsoft YaHei UI, Arial, sans-serif" font-size="20" letter-spacing="6" opacity=".78">LANDMARK DETAIL</text>
    <text x="0" y="54" fill="#f3f7ff" font-family="Microsoft YaHei UI, Inter, Arial, sans-serif" font-size="36" opacity=".9">主星域观测台</text>
    <text x="0" y="92" fill="#e2edff" font-family="Microsoft YaHei UI, Inter, Arial, sans-serif" font-size="18" opacity=".58">抽象细塔 · 光柱 · 平台剪影 · 双层能量环</text>
  </g>

  <g transform="translate(94 1042)" opacity=".66">
    <text x="0" y="0" fill="#e2edff" font-family="Microsoft YaHei UI, Inter, Arial, sans-serif" font-size="18">3D 转换备注</text>
    <text x="0" y="36" fill="#b9f1ff" font-family="Microsoft YaHei UI, Inter, Arial, sans-serif" font-size="16" opacity=".72">用简单几何体实现：Cylinder / Cone / Torus / Sprite glow，避免复杂模型依赖。</text>
  </g>
</svg>
