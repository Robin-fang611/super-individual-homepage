<svg xmlns="http://www.w3.org/2000/svg" width="1400" height="900" viewBox="0 0 1400 900" role="img" aria-labelledby="title desc">
  <title id="title">Current site style observatory detail</title>
  <desc id="desc">A subtle observatory landmark concept using the existing site nebula texture.</desc>
  <defs>
    <radialGradient id="darkFocus" cx="54%" cy="54%" r="62%">
      <stop offset="0" stop-color="#07192a" stop-opacity=".18"/>
      <stop offset=".58" stop-color="#02040b" stop-opacity=".36"/>
      <stop offset="1" stop-color="#02040b" stop-opacity=".82"/>
    </radialGradient>
    <radialGradient id="pillarGlow" cx="50%" cy="45%" r="50%">
      <stop offset="0" stop-color="#f4fdff" stop-opacity=".62"/>
      <stop offset=".24" stop-color="#b9f1ff" stop-opacity=".28"/>
      <stop offset="1" stop-color="#82dfff" stop-opacity="0"/>
    </radialGradient>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="10" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <image href="../images/star-road-hero-composed.png" x="-170" y="-10" width="1680" height="900" preserveAspectRatio="xMidYMid slice" opacity=".9"/>
  <rect width="1400" height="900" fill="url(#darkFocus)"/>

  <g transform="translate(700 518)" opacity=".9">
    <circle cx="0" cy="-42" r="160" fill="url(#pillarGlow)" filter="url(#glow)" opacity=".54"/>
    <ellipse rx="276" ry="72" fill="none" stroke="#b9f1ff" stroke-width="1.5" opacity=".26" transform="rotate(-9)" filter="url(#glow)"/>
    <ellipse rx="358" ry="96" fill="none" stroke="#d8b86a" stroke-width="1" opacity=".13" transform="rotate(16)"/>
    <ellipse rx="190" ry="48" fill="none" stroke="#82dfff" stroke-width="1.3" opacity=".2"/>
    <path d="M-18 154 L18 154 L10 10 L5 10 L3 -186 L-3 -186 L-5 10 L-10 10 Z" fill="#d8f7ff" opacity=".22"/>
    <path d="M-3 -268 L3 -268 L2 172 L-2 172 Z" fill="#f4fdff" opacity=".42" filter="url(#glow)"/>
    <path d="M-86 158 L86 158 L132 196 L-132 196 Z" fill="#82dfff" opacity=".12"/>
    <path d="M-224 198 C-100 166 100 166 224 198" fill="none" stroke="#b9f1ff" stroke-width="1.5" opacity=".26"/>
    <path d="M-94 196 L-154 262 M94 196 L154 262 M-28 196 L-58 282 M28 196 L58 282" stroke="#82dfff" stroke-width="1" opacity=".12"/>
  </g>

  <g transform="translate(92 92)">
    <text x="0" y="0" fill="#b9f1ff" font-family="Inter, Microsoft YaHei UI, Arial, sans-serif" font-size="15" letter-spacing="7" opacity=".68">LANDMARK MOOD</text>
    <text x="0" y="58" fill="#f3f7ff" font-family="Microsoft YaHei UI, Inter, Arial, sans-serif" font-size="34" opacity=".88">观测台只做“存在感”，不做硬模型展示</text>
    <text x="0" y="98" fill="#e2edff" font-family="Microsoft YaHei UI, Inter, Arial, sans-serif" font-size="17" opacity=".48">保留现站星云和能量流质感，3D 里用轻量几何体嵌进去。</text>
  </g>
</svg>
