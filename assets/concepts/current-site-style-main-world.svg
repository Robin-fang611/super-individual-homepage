<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">Current site style main world concept</title>
  <desc id="desc">A revised flat concept aligned with the existing Robin star road visual style.</desc>
  <defs>
    <linearGradient id="leftShade" x1="0" x2="1" y1="0" y2="0">
      <stop offset="0" stop-color="#02040b" stop-opacity=".98"/>
      <stop offset=".38" stop-color="#02040b" stop-opacity=".7"/>
      <stop offset=".72" stop-color="#02040b" stop-opacity=".06"/>
      <stop offset="1" stop-color="#02040b" stop-opacity=".18"/>
    </linearGradient>
    <radialGradient id="domainGlow" cx="50%" cy="50%" r="52%">
      <stop offset="0" stop-color="#e9fbff" stop-opacity=".92"/>
      <stop offset=".14" stop-color="#b9f1ff" stop-opacity=".58"/>
      <stop offset=".42" stop-color="#82dfff" stop-opacity=".15"/>
      <stop offset="1" stop-color="#82dfff" stop-opacity="0"/>
    </radialGradient>
    <filter id="softGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="12" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
    <filter id="thinGlow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <image href="../images/star-road-hero-composed.png" x="0" y="0" width="1600" height="900" preserveAspectRatio="xMidYMid slice"/>
  <rect width="1600" height="900" fill="url(#leftShade)"/>
  <rect width="1600" height="900" fill="#02040b" opacity=".1"/>

  <g transform="translate(910 604)" opacity=".88">
    <ellipse rx="116" ry="34" fill="none" stroke="#b9f1ff" stroke-width="1.6" opacity=".32" transform="rotate(-10)" filter="url(#thinGlow)"/>
    <ellipse rx="168" ry="48" fill="none" stroke="#d8b86a" stroke-width="1" opacity=".18" transform="rotate(14)" filter="url(#thinGlow)"/>
    <circle cx="0" cy="-18" r="78" fill="url(#domainGlow)" opacity=".44" filter="url(#softGlow)"/>
    <path d="M-22 86 L22 86 L13 2 L7 2 L4 -78 L-4 -78 L-7 2 L-13 2 Z" fill="#d8f7ff" opacity=".2"/>
    <path d="M-4 -122 L4 -122 L2 98 L-2 98 Z" fill="#f4fdff" opacity=".48" filter="url(#thinGlow)"/>
    <path d="M-72 92 L72 92 L104 120 L-104 120 Z" fill="#82dfff" opacity=".12"/>
    <path d="M-130 122 C-58 106 58 106 130 122" fill="none" stroke="#b9f1ff" stroke-width="1.4" opacity=".28"/>
  </g>

  <g opacity=".68" filter="url(#thinGlow)">
    <circle cx="1056" cy="498" r="8" fill="#82dfff"/>
    <circle cx="1138" cy="390" r="6" fill="#b9f1ff"/>
    <circle cx="1242" cy="268" r="7" fill="#d8b86a"/>
    <path d="M930 580 C1008 548 1084 474 1140 392 C1188 322 1230 282 1292 252" fill="none" stroke="#b9f1ff" stroke-width="2" opacity=".26"/>
  </g>

  <g transform="translate(98 194)">
    <text x="0" y="0" fill="#b9f1ff" font-family="Inter, Microsoft YaHei UI, Arial, sans-serif" font-size="16" letter-spacing="8" opacity=".72">PERSONAL STAR ROAD</text>
    <text x="0" y="104" fill="#f3f7ff" font-family="Inter, Microsoft YaHei UI, Arial, sans-serif" font-size="96" font-weight="500" opacity=".95">Robin</text>
    <text x="2" y="164" fill="#e2edff" font-family="Microsoft YaHei UI, Inter, Arial, sans-serif" font-size="32" opacity=".68">星辰，进化之路</text>
    <text x="2" y="232" fill="#e2edff" font-family="Microsoft YaHei UI, Inter, Arial, sans-serif" font-size="17" opacity=".42">主星域观测台 · 深空航道 · 当前节点</text>
  </g>
</svg>
