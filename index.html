<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="description" content="Robin 的个人宇宙地图。" />
    <meta name="theme-color" content="#02040b" />
    <title>Robin | 个人宇宙地图</title>
    <link
      rel="icon"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Crect width='64' height='64' rx='32' fill='%2302040b'/%3E%3Ccircle cx='32' cy='32' r='4' fill='%23b9f1ff'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="./styles.css?v=ink-universe-1" />
  </head>
  <body>
    <main class="universe-app" id="universe-app" aria-label="Robin 的个人宇宙地图">
      <section class="intro-screen" id="intro-screen" aria-live="polite">
        <div class="intro-message" id="intro-message">
          <p>这里是，我的世界</p>
          <p class="intro-signature">——Robin</p>
        </div>
      </section>

      <canvas id="universe-canvas" class="universe-canvas" aria-hidden="true"></canvas>

      <section class="hero-hud" id="hero-hud" aria-hidden="true">
        <p class="hero-kicker">星辰 · 进化之路</p>
        <h1 class="hero-name">Robin</h1>
        <p class="hero-subtitle">
          这里是，我的世界。
          <span class="hero-signature">—— 一个进化者的深空星图</span>
        </p>
      </section>

      <nav class="star-compass" id="star-compass" aria-label="星图导航">
        <button class="compass-toggle" id="compass-toggle" type="button" aria-label="打开星图导航">
          <span class="compass-icon">
            <span class="compass-ring-nav"></span>
            <span class="compass-core-nav"></span>
          </span>
        </button>
        <ul class="compass-menu" id="compass-menu" role="list">
          <li><button class="compass-anchor" data-nav="origin" type="button">星路入口</button></li>
          <li><button class="compass-anchor" data-nav="current" type="button">当前</button></li>
          <li><button class="compass-anchor" data-nav="past" type="button">远处节点</button></li>
        </ul>
      </nav>

      <nav class="realm-nav" id="realm-nav" aria-label="境界切换">
        <button class="realm-pill is-active" data-realm="road" type="button">星路</button>
        <button class="realm-pill" data-realm="inner" type="button">内心</button>
        <button class="realm-pill" data-realm="interactive" type="button">互动</button>
      </nav>

      <p class="interaction-hint" id="interaction-hint" aria-hidden="true">
        触控板环视 · 捏合飞行 · 点击星标阅读
      </p>

      <section class="universe-fallback" id="universe-fallback" hidden aria-live="polite">
        <div class="universe-fallback__ink" aria-hidden="true"></div>
        <div class="universe-fallback__content">
          <p>墨色暂时无法成形</p>
          <span>请刷新页面，再次进入这方宇宙。</span>
        </div>
      </section>

      <section
        class="reading-overlay"
        id="reading-overlay"
        role="dialog"
        aria-modal="true"
        aria-hidden="true"
      >
        <button class="reading-close" id="reading-close" type="button" aria-label="关闭阅读">
          ×
        </button>
        <article class="reading-content" id="reading-content" tabindex="-1"></article>
      </section>

      <section class="realm-layer realm-inner" id="realm-inner" aria-hidden="true" hidden>
        <div class="realm-inner__veil" aria-hidden="true"></div>
        <div class="realm-inner__core">
          <p class="realm-inner__kicker">内心世界 · INNER</p>
          <h2 class="realm-inner__title">心核</h2>
          <p class="realm-inner__lead">向下潜入，这里收着未说出口的星思。</p>
          <div class="inner-thoughts" id="inner-thoughts"></div>
        </div>
      </section>

      <section class="realm-layer realm-interactive" id="realm-interactive" aria-hidden="true" hidden>
        <div class="realm-interactive__veil" aria-hidden="true"></div>
        <div class="realm-interactive__panel">
          <p class="realm-interactive__kicker">互动空间 · 访客星屑</p>
          <h2 class="realm-interactive__title">留下一颗星屑</h2>
          <p class="realm-interactive__lead">路过的人，都能在宇宙里留一点光。</p>
          <p class="stardust-meta">已有 <span class="stardust-total">0</span> 颗星屑在宇宙里</p>
          <form class="stardust-form" id="stardust-form">
            <textarea class="stardust-input" id="stardust-input" maxlength="140" rows="2" placeholder="写一句想留下的话…"></textarea>
            <div class="stardust-row">
              <span class="stardust-count" id="stardust-count">0 / 140</span>
              <button class="stardust-send" id="stardust-send" type="submit">点亮</button>
            </div>
          </form>
          <div class="stardust-cloud" id="stardust-cloud" aria-live="polite"></div>
        </div>
      </section>
    </main>

    <noscript>
      <section class="noscript-fallback">
        <h1>Robin | 个人宇宙地图</h1>
        <p>这个页面需要启用 JavaScript 才能展示宇宙地图。</p>
      </section>
    </noscript>

    <script type="module" src="./src/app.mjs?v=universe-map-3"></script>
  </body>
</html>
